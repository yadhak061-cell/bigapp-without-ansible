name: Native K8s Deploy - Online Boutique

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: test
          cluster-name: test

      - name: Apply Microservices Manifests
        run: |
          kubectl apply -f k8s-manifests/kubernetes-manifests.yaml
