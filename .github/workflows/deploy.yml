name: Helm Deploy to AKS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: test
          cluster-name: test

      - name: Log in to ACR
        run: |
          az acr login --name boutiqueacr4516

      - name: Deploy Application via Helm
        run: |
          helm upgrade --install boutique-release ./chart --namespace default
